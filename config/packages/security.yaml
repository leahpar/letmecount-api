security:
    # Les utilisateurs n'ont plus de mot de passe (passkey ou code d'accès).
    # Seul le compte en mémoire qui protège le profiler en utilise encore un.
    password_hashers:
        Symfony\Component\Security\Core\User\InMemoryUser: 'auto'
    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: username
        in_memory:
            memory:
                users:
                    profiler:
                        password: '%env(PROFILER_PWD)%'
                        roles: 'ROLE_PROFILER'

    firewalls:
        dev:
            pattern: ^/(_wdt|css|images|js)/
            security: false

        profiler:
            lazy: true
            pattern: ^/(_profiler)/
            provider: in_memory
            http_basic:
                realm: Secured Area

        api:
            pattern: ^/
            stateless: true
            provider: app_user_provider
            # JWT
            entry_point: jwt
            jwt: ~
            # Connexion par passkey : renvoie le même {token, refresh_token} que /auth
            webauthn:
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
                authentication:
                    routes:
                        options_path: /auth/webauthn/login/options
                        result_path: /auth/webauthn/login
                # L'enrôlement passe par webauthn.controllers.creation, qui exige
                # un utilisateur déjà authentifié (voir config/packages/webauthn.yaml)
                registration:
                    enabled: false
            refresh_jwt:
                check_path: api_refresh_token
            logout:
                path: api_token_invalidate

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
#        - { path: ^/$, roles: PUBLIC_ACCESS } # Allows accessing the Swagger UI
        - { path: ^/docs, roles: PUBLIC_ACCESS } # Allows accessing the Swagger UI docs
        # Métadonnées OAuth (RFC 9728) : un client MCP les lit avant d'avoir un jeton.
        # Le préfixe `oauth-` plutôt que tout `.well-known` : les autres routes qui
        # y vivent (genid d'API Platform, webauthn) ne sont pas concernées.
        - { path: '^/\.well-known/oauth-', roles: PUBLIC_ACCESS }
        # Serveur d'autorisation OAuth. Le consentement est la seule étape qui
        # exige un humain identifié : à garder AVANT la règle ^/authorize, qui
        # est publique parce que le navigateur y arrive sans jeton.
        - { path: ^/authorize/consent, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/authorize, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: ^/token, roles: PUBLIC_ACCESS }
#        - { path: ^/contexts, roles: PUBLIC_ACCESS } # Allows accessing the Swagger UI contexts
        # Enrôler un passkey suppose d'être déjà connecté : à garder AVANT la règle ^/auth
        - { path: ^/auth/webauthn/register, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/auth, roles: PUBLIC_ACCESS }
        - { path: ^/_profiler, roles: PUBLIC_ACCESS, ip: '%env(TRUSTED_IPS)%' }
        - { path: ^/_profiler, roles: ROLE_PROFILER }
        - { path: ^/, roles: IS_AUTHENTICATED_FULLY }
