webauthn:
    credential_repository: App\Repository\WebauthnCredentialRepository
    user_repository: App\Repository\WebauthnUserEntityRepository

    # Firewall stateless (JWT) : le challenge est stocké en cache, pas en session
    options_storage: app.webauthn.options_storage

    # Le front et l'API sont sur deux domaines distincts : la cérémonie a lieu
    # à l'origine du front, on ne peut donc pas se fier au host de la requête.
    allowed_origins:
        - '%env(WEBAUTHN_ALLOWED_ORIGIN)%'

    creation_profiles:
        default:
            rp:
                id: '%env(WEBAUTHN_RP_ID)%'
                name: 'LetMeCount'
            timeout: 60000
            # Sans cette liste le profil n'annonce aucun algorithme aux authentificateurs.
            # ES256 couvre iOS/Android, RS256 Windows Hello.
            public_key_credential_parameters:
                - -7    # ES256
                - -257  # RS256
                - -8    # EdDSA
            authenticator_selection_criteria:
                # Passkey découvrable : connexion sans saisir de username
                resident_key: required
                user_verification: required
            attestation_conveyance: none

    request_profiles:
        default:
            rp_id: '%env(WEBAUTHN_RP_ID)%'
            timeout: 60000
            user_verification: required

    # Enrôlement d'un passkey : réservé à l'utilisateur déjà authentifié (JWT).
    # On n'utilise pas la "registration" du firewall, qui déduit l'utilisateur du
    # corps de la requête et permettrait donc d'enrôler un passkey sur le compte
    # de n'importe qui.
    controllers:
        enabled: true
        creation:
            profile:
                options_path: /auth/webauthn/register/options
                result_path: /auth/webauthn/register
                user_entity_guesser: Webauthn\Bundle\Security\Guesser\CurrentUserEntityGuesser
