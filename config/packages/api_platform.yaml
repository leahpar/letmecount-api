api_platform:
    title: Hello API Platform
    version: 1.0.0
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']

    # Le nœud est activé par défaut, mais son câblage est conditionné à la
    # présence de McpBundle : autant que le fichier dise ce qui est vrai.
    mcp:
        enabled: true

    swagger:
        api_keys:
            JWT:
                name: Authorization
                type: header
