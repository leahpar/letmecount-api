api_refresh_token:
    path: /auth/refresh

api_token_invalidate:
    path: /auth/logout

controllers:
    resource:
        path: ../src/Controller/
        namespace: App\Controller
    type: attribute

# Routes générées par le bundle WebAuthn (sa recette Flex ne les déclare pas)
webauthn:
    resource: .
    type: webauthn

# Endpoint MCP, déclaré par le RouteLoader de symfony/mcp-bundle.
# Le chemin lui-même est dans config/packages/mcp.yaml.
mcp:
    resource: .
    type: mcp
